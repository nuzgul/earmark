name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# macOS minutes are scarce on a private repo: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Goldens are rendered on Windows by the owner; font rasterising differs on Linux.
      - run: flutter test --exclude-tags golden
      - run: flutter build apk --debug
      # Engine logic on the JVM: ADTS framing, frame→ms, journal with a torn last line.
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: app/android
      # The owner's timing sequence needs an emulator: run app/tool/integration_android.sh locally.
      - uses: actions/upload-artifact@v4
        with:
          name: earmark-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    # The owner has no Mac: this job is the iOS build and test machine. It compiles the app and the
    # widget extension for the simulator, then runs the same integration tests as Android there
    # (engine test tone, no microphone). Device-only checks: docs/DEVICE-CHECKS.md, part C.
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: Integration tests on a simulator
        run: tool/integration_ios.sh
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-integration-logs
          path: app/build/ci-logs/
          if-no-files-found: ignore
