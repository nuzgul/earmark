name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Goldens are rendered on Windows by the owner; font rasterising differs on Linux.
      - run: flutter test --exclude-tags golden
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: earmark-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    # Compile check only (no signing). The owner has no Mac; this is the iOS safety net.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
