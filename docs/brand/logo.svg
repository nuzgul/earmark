<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Earmark logo: a bookmark ribbon that is also the tallest bar of a sound wave">
  <!-- App icon. Carbon tile; four cream sound bars; the centre bar is a marigold bookmark ribbon hanging from the top edge. -->
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#14130F"/>
    <!-- sound bars, centred on y = 600 -->
    <rect x="196" y="530" width="76" height="140" rx="38" fill="#F3EEE2" opacity=".55"/>
    <rect x="316" y="430" width="76" height="340" rx="38" fill="#F3EEE2"/>
    <rect x="632" y="400" width="76" height="400" rx="38" fill="#F3EEE2"/>
    <rect x="752" y="510" width="76" height="180" rx="38" fill="#F3EEE2" opacity=".55"/>
    <!-- the ribbon: a bar that starts above the tile edge and ends in a bookmark notch -->
    <path d="M436 -10 H588 V838 L512 772 L436 838 Z" fill="#FFC23D"/>
  </g>
</svg>
